<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" rx="12" fill="#1e1e2e"/>

  <!-- Data Sources (left) -->
  <rect x="16" y="20" width="80" height="70" rx="8" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="56" y="42" text-anchor="middle" fill="#f9e2af" font-size="9" font-weight="700" font-family="monospace">Sources</text>
  <text x="56" y="56" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">APIs</text>
  <text x="56" y="66" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">Databases</text>
  <text x="56" y="76" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">Files · Logs</text>

  <!-- Arrow Sources → Kafka -->
  <line x1="96" y1="55" x2="130" y2="55" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrowW3)"/>

  <!-- Kafka -->
  <rect x="130" y="18" width="110" height="74" rx="10" fill="#181825" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="185" y="42" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="700" font-family="monospace">Kafka</text>
  <text x="185" y="58" text-anchor="middle" fill="#6c7086" font-size="8" font-family="monospace">Topics · Partitions</text>
  <text x="185" y="72" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">Real-time Streaming</text>
  <text x="185" y="84" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">Producer → Consumer</text>

  <!-- Arrow Kafka → Spark -->
  <line x1="240" y1="55" x2="274" y2="55" stroke="#fab387" stroke-width="1.5" marker-end="url(#arrowO3)"/>

  <!-- Spark -->
  <rect x="274" y="22" width="110" height="68" rx="8" fill="#181825" stroke="#fab387" stroke-width="1.5"/>
  <text x="329" y="46" text-anchor="middle" fill="#fab387" font-size="11" font-weight="700" font-family="monospace">Spark</text>
  <text x="329" y="60" text-anchor="middle" fill="#6c7086" font-size="8" font-family="monospace">Streaming · ML</text>
  <text x="329" y="74" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">Transform · Aggregate</text>

  <!-- Arrow Spark → HBase -->
  <line x1="329" y1="90" x2="290" y2="120" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowR3)"/>

  <!-- HBase -->
  <rect x="200" y="120" width="130" height="58" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <ellipse cx="265" cy="130" rx="55" ry="7" fill="#313244" stroke="#f38ba8" stroke-width="0.6"/>
  <text x="265" y="152" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="700" font-family="monospace">HBase</text>
  <text x="265" y="166" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">Column-family Store</text>

  <!-- Arrow HBase → Streamlit -->
  <line x1="200" y1="148" x2="130" y2="148" stroke="#f38ba8" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrowR3b)"/>

  <!-- Streamlit -->
  <rect x="24" y="120" width="106" height="58" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="77" y="146" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="700" font-family="monospace">Streamlit</text>
  <text x="77" y="160" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">Dashboard · Viz</text>
  <text x="77" y="170" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">Plotly · Charts</text>

  <!-- Flow label -->
  <text x="200" y="196" text-anchor="middle" fill="#45475a" font-size="7" font-family="monospace">Ingest → Stream → Process → Store → Visualize</text>

  <defs>
    <marker id="arrowW3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cdd6f4"/>
    </marker>
    <marker id="arrowO3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fab387"/>
    </marker>
    <marker id="arrowR3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
    <marker id="arrowR3b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
  </defs>
</svg>
