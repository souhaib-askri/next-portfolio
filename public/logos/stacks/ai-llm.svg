<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" rx="12" fill="#1e1e2e"/>
  
  <!-- Grid -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#313244" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- User Input -->
  <rect x="16" y="30" width="90" height="50" rx="8" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="61" y="52" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="700" font-family="monospace">User</text>
  <text x="61" y="66" text-anchor="middle" fill="#6c7086" font-size="8" font-family="monospace">Prompt</text>

  <!-- Arrow User → LangChain -->
  <line x1="106" y1="55" x2="140" y2="55" stroke="#cba6f7" stroke-width="1.5" marker-end="url(#arrowP2)"/>

  <!-- LangChain Agent -->
  <rect x="140" y="18" width="120" height="74" rx="10" fill="#181825" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="200" y="42" text-anchor="middle" fill="#cba6f7" font-size="11" font-weight="700" font-family="monospace">LangChain</text>
  <text x="200" y="58" text-anchor="middle" fill="#6c7086" font-size="8" font-family="monospace">Chains · Agents</text>
  <text x="200" y="72" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">Tool Calling · Memory</text>
  <text x="200" y="84" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">RAG Pipeline</text>

  <!-- Arrow LangChain → LLM -->
  <line x1="260" y1="45" x2="290" y2="45" stroke="#f5c2e7" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="275" y="40" text-anchor="middle" fill="#f5c2e7" font-size="6" font-family="monospace">call</text>

  <!-- LLM -->
  <rect x="290" y="22" width="94" height="48" rx="8" fill="#181825" stroke="#f5c2e7" stroke-width="1.5"/>
  <text x="337" y="44" text-anchor="middle" fill="#f5c2e7" font-size="10" font-weight="700" font-family="monospace">LLM API</text>
  <text x="337" y="58" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">Gemini · Ollama</text>

  <!-- Arrow LangChain → Vector DB -->
  <line x1="200" y1="92" x2="200" y2="120" stroke="#94e2d5" stroke-width="1.5" marker-end="url(#arrowT2)"/>
  <text x="215" y="110" fill="#94e2d5" font-size="6" font-family="monospace">embed</text>

  <!-- Vector DB -->
  <rect x="130" y="120" width="140" height="56" rx="8" fill="#181825" stroke="#94e2d5" stroke-width="1.5"/>
  <ellipse cx="200" cy="130" rx="60" ry="8" fill="#313244" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="200" y="152" text-anchor="middle" fill="#94e2d5" font-size="10" font-weight="700" font-family="monospace">ChromaDB</text>
  <text x="200" y="166" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">Embeddings · FAISS</text>

  <!-- FastAPI -->
  <rect x="300" y="120" width="84" height="50" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="342" y="144" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="700" font-family="monospace">FastAPI</text>
  <text x="342" y="158" text-anchor="middle" fill="#6c7086" font-size="7" font-family="monospace">async · Pydantic</text>

  <!-- Arrow LangChain → FastAPI -->
  <line x1="260" y1="75" x2="310" y2="120" stroke="#a6e3a1" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrowG2)"/>

  <!-- Python badge -->
  <rect x="16" y="130" width="90" height="40" rx="6" fill="#181825" stroke="#f9e2af" stroke-width="1"/>
  <text x="61" y="152" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="700" font-family="monospace">Python</text>
  <text x="61" y="163" text-anchor="middle" fill="#585b70" font-size="7" font-family="monospace">Runtime</text>

  <defs>
    <marker id="arrowP2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cba6f7"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f5c2e7"/>
    </marker>
    <marker id="arrowT2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94e2d5"/>
    </marker>
    <marker id="arrowG2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>
